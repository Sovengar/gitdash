name: CI

# NOTE: this workflow intentionally has NO `paths` / `paths-ignore` filters.
# A path-filtered push/PR skips the workflow entirely; a skipped workflow leaves
# its required status checks stuck in "pending" forever, which deadlocks every
# PR that does not touch the filtered paths. The gates run on every change.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous
# check run. Main is exempt: every commit landing on main gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: GOLANGCI_LINT_VERSION lives there,
          # so bumping the linter busts the cached modules instead of reusing stale ones.
          cache-dependency-path: |
            go.sum
            Makefile
      # Exact `make lint` parity: the repo Makefile runs vet + fmt-check
      # (gofmt) and the pinned golangci-lint v2.13.2 (no .golangci.yml exists
      # -> default linter set).
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: el gate necesita `git diff $BASE...HEAD`, y un
          # clon de profundidad 1 hace que ese diff sea un no-op — el diff
          # saldria vacio y el gate aprobaria todos los PRs en silencio.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Same suite as `make test` (`go test -race`, no `-short`), plus an
      # atomic coverage profile. `-count=1` disables the Go test cache so every
      # CI run executes the tests for real instead of replaying cached results.
      # The suite is self-contained: every git fixture is created under
      # t.TempDir() via internal/testutil, so no `make fixtures` / testdata
      # checkout is needed.
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      # `func main()` llama a os.Exit, asi que no puede correr dentro del binario
      # de test: corre en un subproceso (cmd/gitdash/main_test.go), y sus
      # contadores caen en un GOCOVERDIR aparte que `go test -coverprofile` no
      # fusiona. Sin este paso, main() sale a 0 pese a estar testeado de verdad.
      - name: Coverage of the subprocess (main)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .covmain
          go build -cover -o .covmain/gitdash ./cmd/gitdash
          # --print recorre discovery+collect y sale 0. El codigo de salida no
          # importa aqui: lo que se necesita es el perfil de cobertura.
          XDG_CONFIG_HOME="$(mktemp -d)" GOCOVERDIR="$PWD/.covmain" \
            ./.covmain/gitdash --print >/dev/null 2>&1 || true
          go tool covdata textfmt -i=.covmain -o=.covmain/main.txt
          test -s .covmain/main.txt
      # El gate va al final y sin `continue-on-error`: si el perfil no se
      # escribio (suite rota antes), el step falla, que es lo que tiene que
      # pasar. Un gate que se salta cuando algo falla no protege nada.
      - name: Coverage gate
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "::error::no coverage.out (los tests fallaron antes de escribirlo)"
            exit 1
          fi
          base="${{ github.event.pull_request.base.ref || 'main' }}"
          scripts/diff-coverage.sh coverage.out "$base" -a "$PWD/.covmain/main.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"
