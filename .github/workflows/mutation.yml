name: Mutation (diff)

# Mutation testing via gremlins sobre EL DIFF del PR (no el módulo entero), con
# un gate que bloquea los mutantes NUEVOS que sobreviven. Required status check:
# Build, Lint, Test y Mutation bloquean el merge.
#
# Deliberadamente sin filtros `paths`: un workflow filtrado se salta, y un check
# obligatorio saltado se queda en "pending" para siempre. Aquí no hay filtro y el
# scope se decide DENTRO del job, así que el job SIEMPRE acaba en pass o fail.
#
# Por eso este workflow es apto como required check, y por eso `Calibration` NO
# se salta: si .mutation-allowlist falta, el job de mutación se salta, y un check
# saltado es un check colgado. La versión anterior tenía exactamente ese `if:` y
# por eso el comentario de aquí decía que NO se marcara como obligatorio. La
# calibración se comprueba ahora DENTRO del job (step `Calibration`), así que el
# job siempre reporta: si no está calibrado, falla con un mensaje que dice cómo
# calibrarlo, que es más útil que un job verde que no midió nada.
on:
  pull_request:
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous run.
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Mutation:
    name: Mutation (diff)
    # Sin `needs:` ni `if:` a proposito: el job tiene que REPORTAR siempre. Un job
    # saltado en un required check se queda en pending para siempre y bloquea
    # todos los PRs (la misma clase de fallo que un filtro de paths). La
    # calibracion se comprueba en un step de aqui, y si falta, este job falla
    # diciendo como calibrarlo.
    runs-on: ubuntu-24.04
    runs-on: ubuntu-24.04
    # Hard cap. gremlins is never signalled: on SIGTERM it panics
    # ("send on closed channel") and writes no report.json, so a timeout can only
    # mean "no result", never a wrong one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base ref exists for `git diff <base>...HEAD`
          # and for `gremlins --diff <base>`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: MUTATE_BASE and the tool wiring live
          # there, so changing them busts stale module caches.
          cache-dependency-path: |
            go.sum
            Makefile

      # Sin este step el gate no puede hacer nada: sin allowlist, cualquier
      # mutante nuevo parecería "nuevo" y el gate no tendria con que compararlo.
      # Falla aqui en vez de saltarse el job, porque un job saltado en un required
      # check bloquea todos los PRs para siempre.
      - name: Calibration
        id: calibration
        run: |
          set -euo pipefail
          if [ ! -f .mutation-allowlist ]; then
            echo "::error title=Mutation testing not calibrated::.mutation-allowlist is missing, so the gate cannot run and no surviving mutant is being detected. Seed it with: make mutate, then commit .mutation-allowlist"
            exit 1
          fi
          echo "calibrated: $(grep -cvE '^[[:space:]]*(#|$)' .mutation-allowlist) allowlisted mutants"

      - name: Resolve mutation scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "base=$BASE"
          # Belt and braces: guarantee the base ref is fetched even on shallow setups.
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || \
            echo "could not fetch base ref $BASE_BRANCH; continuing with what is present"
          # El scope es el DIFF contra la base, no el modulo entero: por eso este
          # check dura segundos. `make mutate` (modulo entero) es el caro.
          if git diff --name-only "$BASE...HEAD" | grep -q '\.go$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$BASE...HEAD" | grep '\.go$' | sed 's/^/  changed: /'
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no .go changes vs $BASE - nothing to mutate"
          fi

      - name: Mutate
        if: steps.scope.outputs.run == 'true'
        # A gremlins crash must not be read as a mutation failure: the Gate step
        # below decides, and it treats a missing report.json as "no result".
        continue-on-error: true
        run: make mutate-diff MUTATE_BASE=origin/${{ github.base_ref || github.event.repository.default_branch }}

      # Blocking gate: fail on any surviving mutant in the diff that is not already
      # listed in .mutation-allowlist.
      - name: Gate
        if: always() && steps.scope.outputs.run == 'true'
        env:
          ALLOWLIST: .mutation-allowlist
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          : > "$S"
          echo "### Mutation testing" >> "$S"

          if [ ! -f report.json ]; then
            echo "- no report.json (timed out, or gremlins crashed) -> no result, gate passes" >> "$S"
            exit 0
          fi

          echo "- total: $(jq -r '.mutants_total' report.json)" >> "$S"
          echo "- killed: $(jq -r '.mutants_killed' report.json)" >> "$S"
          echo "- survived: $(jq -r '.mutants_lived' report.json)" >> "$S"
          echo "- not covered: $(jq -r '.mutants_not_covered' report.json)" >> "$S"
          echo "- test efficacy: $(jq -r '.test_efficacy' report.json)%" >> "$S"
          echo "- mutator coverage: $(jq -r '.mutations_coverage' report.json)%" >> "$S"
          echo "- note: gremlins does not report TIMED OUT mutants in report.json, and efficacy excludes them" >> "$S"

          jq -r '.files[] | .file_name as $f | .mutations[] | select(.status=="LIVED") | "\(.type) \($f):\(.line)"' report.json | sort -u > /tmp/lived.txt
          total=$(wc -l < /tmp/lived.txt)

          # Sin la comprobacion de "existe el allowlist" aqui: el step Calibration
          # de este mismo job ya aborta el job si falta, con un mensaje que dice
          # como sembrarlo. Tenerla en dos sitios era una puerta trasera mas: si
          # el allowlist desaparecia entre steps, el gate pasaba en verde sin
          # haber comparado nada.
          grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST" | sed 's/[[:space:]]*$//' | sort -u > /tmp/allow.txt
          comm -23 /tmp/lived.txt /tmp/allow.txt > /tmp/new_lived.txt
          new=$(wc -l < /tmp/new_lived.txt)

          echo "- surviving in diff: $total (allowlisted: $((total - new)), new: $new)" >> "$S"

          if [ "$new" -gt 0 ]; then
            {
              echo ""
              echo "New surviving mutants - no test catches these changes:"
              sed 's/^/- /' /tmp/new_lived.txt
              echo ""
              echo "Add a test that kills them, or - only if provably equivalent - add the line to $ALLOWLIST with a comment saying why."
            } >> "$S"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.event.pull_request.number || github.run_id }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 14
